<script>
/* Вход на сайт — глава 1; старые адреса #N.s ведут на N.html#N.s, #N — на N.html. */
(function () {
  // число параграфов в главах 1…40
  var C = [16,18,12,10,10,9,20,2,4,7,30,7,5,3,3,6,8,6,2,11,15,22,13,4,3,32,6,7,21,8,20,20,13,13,11,122,56,184,69,26];
  var h = location.hash.slice(1), to = "1.html";
  try { h = decodeURIComponent(h); } catch (e) {}
  var m = /^(\d+)(?:\.(\d+))?$/.exec(h);
  var n = m ? parseInt(m[1], 10) : 0, s = m && m[2] ? parseInt(m[2], 10) : 0;
  if (n >= 1 && n <= C.length) {
    to = n + ".html";
    if (s >= 1 && s <= C[n - 1]) to += "#" + n + "." + s;
  }
  location.replace(to);
})();
</script>
